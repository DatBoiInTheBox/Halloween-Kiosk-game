<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Haunted Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#140a1f;--pn:#2a1646;--ln:#4b2a7a;--or:#ff7a1a;--pu:#9b5cff;--tx:#fff1dc;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:radial-gradient(ellipse at 50% 0,#3a1b5e,var(--bg) 62%);color:var(--tx);font:500 20px Fredoka,system-ui,sans-serif}
[hidden]{display:none!important}
.i{width:1em;height:1em;display:inline-block;vertical-align:-.15em}
button *{pointer-events:none}
.lb{width:min(92vw,640px);display:flex;flex-direction:column;gap:8px}
.lb .r{display:grid;grid-template-columns:44px 1fr auto;gap:12px;text-align:left;background:var(--pn);border:2px solid var(--ln);border-radius:12px;padding:8px 16px;font-size:clamp(20px,3.6vw,30px);font-weight:700}
.lb .r.me{border-color:var(--or);background:#4a2a10}
.h{text-align:center;font-size:24px;opacity:.85}
.ini{display:flex;gap:14px}.ini span{width:84px;height:100px;border-bottom:6px solid var(--or);font:400 76px/100px Creepster,Georgia,serif;text-align:center;color:var(--or)}
.kb{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;width:min(94vw,640px)}
#stage .kb button{aspect-ratio:1;font-size:clamp(24px,6vw,44px)}
#stage .kb .wd{grid-column:span 2;aspect-ratio:auto;font-size:clamp(20px,4vw,30px);background:var(--ln)}
#stage .kb .sv{grid-column:span 7;background:var(--or);color:#2a0f00;min-height:64px}
#lbb{align-self:center}
#app{height:100%;padding:14px}
#hw,#game{height:100%;display:flex;flex-direction:column;gap:12px}
h1{font:400 clamp(52px,12vw,104px)/1 Creepster,Georgia,serif;color:var(--or);margin:0;text-align:center;text-shadow:0 0 26px #ff7a1a99;letter-spacing:2px;animation:fl 7s infinite}
@keyframes fl{0%,90%,94%,100%{opacity:1}92%,96%{opacity:.3}}
.sub{text-align:center;margin:0;font-size:clamp(18px,3.4vw,28px);opacity:.85}
#home{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:12px}
.card{background:var(--pn);border:3px solid var(--ln);border-radius:24px;color:var(--tx);font:inherit;font-size:clamp(16px,3.3vw,27px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;line-height:1.1}
.card b{font-size:clamp(44px,11vw,92px);font-weight:400;line-height:1}
.card:active{transform:scale(.95);border-color:var(--or)}
#bar{display:flex;align-items:center;gap:12px}
#title{flex:1;text-align:center;font:400 clamp(30px,6vw,52px)/1 Creepster,Georgia,serif;color:var(--or)}
#score{min-width:120px;text-align:right;font-size:26px;font-weight:700}
.btn{background:var(--or);color:#2a0f00;border:0;border-radius:16px;font:700 26px Fredoka,sans-serif;padding:14px 22px;min-height:64px}
.btn:active{transform:scale(.95)}
#stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.msg{font-size:clamp(22px,4.2vw,32px);text-align:center;padding:0 12px}
.g{display:grid;gap:10px;width:min(92vw,58vh)}
.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
#stage button{background:var(--pn);border:3px solid var(--ln);border-radius:16px;color:var(--tx);font:700 clamp(28px,9vw,70px) Fredoka,sans-serif;padding:0}
.g button{aspect-ratio:1}
#stage .btn{background:var(--or);color:#2a0f00;border:0;font-size:26px;padding:14px 22px}
#stage .on{background:#5a2d9a}
#stage button:disabled{opacity:.55;color:var(--tx)}
#stage .fl{filter:brightness(2.6);transform:scale(.95)}
#stage .lt{background:#ffb02e;border-color:#ffd37a;box-shadow:0 0 24px #ff7a1a}
canvas{aspect-ratio:3/4;height:min(54vh,120vw);background:#0d0616;border:3px solid var(--ln);border-radius:16px;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,92px);gap:8px}
#stage .pad button{height:76px;font-size:34px;background:var(--ln)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:94vw;min-height:80px}
#stage .row button{width:clamp(50px,11vw,84px);aspect-ratio:1;font-size:clamp(26px,6vw,44px)}
#stage .sl{border-style:dashed;background:transparent}
.ov{position:absolute;inset:0;background:#140a1fe6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;overflow-y:auto;padding:12px;text-align:center;font-size:32px;border-radius:20px}
.ov b{font:400 clamp(60px,14vw,100px)/1 Creepster,Georgia,serif;color:var(--or)}
@media (prefers-reduced-motion:reduce){h1{animation:none}}
</style></head>
<body><div id="app">
<div id="hw"><h1>Haunted Arcade</h1><p class="sub">Cyber &amp; IT Lab. Tap a game to play!</p><div id="home"></div><button class="btn" id="lbb">Leaderboards</button></div>
<div id="game" hidden><div id="bar"><button class="btn" id="back">◀ Games</button><div id="title"></div><div id="score"></div></div><div id="stage"></div></div>
</div>
<script>
const $=(q,r=document)=>r.querySelector(q),R=n=>Math.random()*n|0,sh=a=>a.sort(()=>Math.random()-.5);
let tm=[],cur=-1,idle,AC;
const later=(f,m)=>{const t=setTimeout(f,m);tm.push(t);return t},every=(f,m)=>{const t=setInterval(f,m);tm.push(t);return t};
const stop=()=>{tm.forEach(t=>{clearTimeout(t);clearInterval(t)});tm=[]};
function beep(f,d=.15){try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.1;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const S=$('#stage'),SC=$('#score');
function endOld(m){stop();const o=document.createElement('div');o.className='ov';o.innerHTML=`<b>${m[0]}</b><div>${m[1]}</div><div><button class="btn" id="ag">Play again</button> <button class="btn" id="hm" style="background:var(--pu);color:#fff">All games</button></div>`;S.append(o);$('#ag',o).onclick=()=>play(cur);$('#hm',o).onclick=home;beep(m[0].includes('!')&&!/Oops|Boo|over/.test(m[0])?880:200,.4)}

/* Built-in vector icons: the kiosk has no emoji font, so every emoji is swapped for an SVG */
const I={
pumpkin:`<ellipse cx="32" cy="38" rx="25" ry="20" fill="#ff7a1a" stroke="#b34700" stroke-width="3"/><rect x="29" y="8" width="7" height="11" rx="2" fill="#5a8f29"/><path d="M16 30l10-2-3 9zM48 30l-10-2 3 9z" fill="#2a0f00"/><path d="M18 45q14 10 28 0l-5-4-4 3-5-4-5 4-4-3z" fill="#2a0f00"/>`,
ghost:`<path d="M10 58V28a22 22 0 0 1 44 0v30l-7-6-7 6-8-6-8 6-7-6z" fill="#f4f0ff"/><circle cx="23" cy="28" r="4.5" fill="#222"/><circle cx="41" cy="28" r="4.5" fill="#222"/><ellipse cx="32" cy="41" rx="4" ry="5.5" fill="#222"/>`,
candy:`<path d="M18 32L3 20v24zM46 32l15-12v24z" fill="#ff9bd0"/><circle cx="32" cy="32" r="15" fill="#ff4fa3"/><path d="M25 22q7 10 0 20" stroke="#fff" stroke-width="3" fill="none"/>`,
pop:`<rect x="30" y="36" width="4" height="24" fill="#eee"/><circle cx="32" cy="24" r="18" fill="#44c8f5"/><path d="M32 24m-9 0a9 9 0 1 1 9 9" stroke="#fff" stroke-width="4" fill="none"/>`,
vamp:`<circle cx="32" cy="36" r="22" fill="#e8dfff"/><path d="M9 32Q10 6 32 8Q54 6 55 32Q44 18 32 21Q20 18 9 32z" fill="#222"/><circle cx="24" cy="36" r="3" fill="#c00"/><circle cx="40" cy="36" r="3" fill="#c00"/><path d="M22 46q10 6 20 0" stroke="#222" stroke-width="2" fill="none"/><path d="M25 47l3 9 3-8zM39 47l-3 9-3-8z" fill="#fff" stroke="#222"/>`,
bat:`<path d="M32 26Q22 10 2 14Q10 22 8 34Q16 28 22 40Q28 32 32 40Q36 32 42 40Q48 28 56 34Q54 22 62 14Q42 10 32 26z" fill="#8a5ad8"/><path d="M26 22l2-9 4 6 4-6 2 9z" fill="#8a5ad8"/><circle cx="28" cy="27" r="2" fill="#fff"/><circle cx="36" cy="27" r="2" fill="#fff"/>`,
spider:`<path d="M32 34L8 14M32 34L3 30M32 34L6 48M32 34L14 60M32 34L56 14M32 34L61 30M32 34L58 48M32 34L50 60" stroke="#c9b6ff" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="32" cy="39" r="13" fill="#3b2a4d" stroke="#c9b6ff" stroke-width="2"/><circle cx="32" cy="23" r="8" fill="#3b2a4d" stroke="#c9b6ff" stroke-width="2"/><circle cx="29" cy="22" r="2" fill="#ff3b3b"/><circle cx="35" cy="22" r="2" fill="#ff3b3b"/>`,
skull:`<path d="M32 5C16 5 9 17 11 30c1 6 6 8 9 10v11h24V40c3-2 8-4 9-10C55 17 48 5 32 5z" fill="#f2efe6"/><circle cx="22" cy="30" r="6" fill="#222"/><circle cx="42" cy="30" r="6" fill="#222"/><path d="M32 36l-3 7h6z" fill="#222"/><path d="M26 44v7M32 44v7M38 44v7" stroke="#222" stroke-width="2"/>`,
witch:`<path d="M32 3L17 42h30z" fill="#3a2266" stroke="#9b5cff" stroke-width="2"/><ellipse cx="32" cy="46" rx="27" ry="8" fill="#3a2266" stroke="#9b5cff" stroke-width="2"/><rect x="21" y="34" width="22" height="6" fill="#ff7a1a"/>`,
basket:`<path d="M14 26a18 16 0 0 1 36 0" fill="none" stroke="#6b3d10" stroke-width="5"/><path d="M5 26h54l-8 31H13z" fill="#c8843a" stroke="#6b3d10" stroke-width="3"/><path d="M22 30l3 23M32 30v23M42 30l-3 23" stroke="#6b3d10" stroke-width="2"/>`,
hammer:`<rect x="28" y="22" width="9" height="38" rx="3" fill="#c8843a"/><rect x="8" y="6" width="48" height="22" rx="6" fill="#a9afc6" stroke="#555" stroke-width="2"/>`,
boom:`<path d="M32 2l8 16 17-8-6 17 13 6-15 7 9 15-18-5-4 16-6-16-17 7 7-17L2 31l16-5-5-17 15 8z" fill="#ffd23a" stroke="#ff7a1a" stroke-width="2"/>`,
heart:`<path d="M32 57S5 40 5 22a14 14 0 0 1 27-5 14 14 0 0 1 27 5C59 40 32 57 32 57z" fill="#ff3b5c"/>`,
star:`<path d="M32 3l9 19 20 3-15 14 4 21-18-10-18 10 4-21L3 25l20-3z" fill="#ffd23a"/>`,
clock:`<circle cx="32" cy="33" r="25" fill="none" stroke="currentColor" stroke-width="6"/><path d="M32 17v17l11 6" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>`,
up:`<path d="M32 10L58 54H6z" fill="currentColor"/>`,down:`<path d="M32 54L58 10H6z" fill="currentColor"/>`,left:`<path d="M10 32L54 6v52z" fill="currentColor"/>`,right:`<path d="M54 32L10 6v52z" fill="currentColor"/>`};
const EM={'🎃':'pumpkin','👻':'ghost','🍬':'candy','🍭':'pop','🧛':'vamp','🦇':'bat','🕷':'spider','💀':'skull','🧙':'witch','🧺':'basket','🔨':'hammer','💥':'boom','❤':'heart','⭐':'star','⏱':'clock','◀':'left','▶':'right','▲':'up','▼':'down'};
const ic=n=>`<svg class="i" viewBox="0 0 64 64">${I[n]}</svg>`,RX=new RegExp(Object.keys(EM).join('|'),'g'),IM={};
Object.keys(I).forEach(n=>{IM[n]=new Image();IM[n].src='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" color="#fff1dc">${I[n]}</svg>`)});
const dr=(x,e,cx,cy,z)=>{const m=IM[EM[e.replace(/\uFE0F/g,'')]];if(m&&m.complete)x.drawImage(m,cx-z/2,cy-z/2,z,z)};
function fix(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];while(w.nextNode())L.push(w.currentNode);
 L.forEach(t=>{const v=t.nodeValue.replace(/\uFE0F/g,'');RX.lastIndex=0;if(!RX.test(v))return;RX.lastIndex=0;const sp=document.createElement('span');sp.innerHTML=v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(RX,m=>ic(EM[m]));t.replaceWith(sp)})}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType==1)fix(n);else if(n.nodeType==3&&n.parentNode)fix(n.parentNode)}))).observe(document.body,{childList:true,subtree:true});
fix(document.body);

/* 1. Ghost Tic-Tac-Toe */
function ttt(s){
 let b=Array(9).fill(''),done=0,busy=0;const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 s.innerHTML='<div class="msg">Get three in a row. You are 🎃!</div><div class="g g3"></div>';
 const g=$('.g',s),w=p=>L.some(l=>l.every(i=>b[i]==p)),draw=()=>g.innerHTML=b.map((v,i)=>`<button data-i="${i}">${v}</button>`).join('');
 const need=p=>{for(const l of L){const e=l.filter(i=>!b[i]);if(e.length==1&&l.filter(i=>b[i]==p).length==2)return e[0]}return -1};
 const chk=()=>{if(w('🎃'))end(['You win!','The ghost ran away 👻']);else if(w('👻'))end(['Boo!','The ghost got you. Try again!']);else if(b.every(x=>x))end(['A draw!','A spooky stalemate.']);else return 0;done=1;return 1};
 draw();
 g.onpointerdown=e=>{const i=+e.target.dataset.i;if(done||busy||isNaN(i)||b[i])return;b[i]='🎃';beep(520,.1);draw();if(chk())return;busy=1;
  later(()=>{let k=Math.random()<.2?-1:need('👻');if(k<0)k=need('🎃');if(k<0&&!b[4])k=4;if(k<0||Math.random()<.12){const f=b.map((v,j)=>v?-1:j).filter(j=>j>=0);k=f[R(f.length)]}b[k]='👻';beep(220,.15);busy=0;draw();chk()},500)};
}

/* 2. Candy Maze */
function maze(s){
 const W=9,H=12,Z=60,c=Array(W*H).fill(15),seen=new Set([0]),st=[0],D=[[0,-1,1,4],[1,0,2,8],[0,1,4,1],[-1,0,8,2]];
 while(st.length){const i=st[st.length-1],x=i%W,y=i/W|0,n=D.filter(d=>{const a=x+d[0],b=y+d[1];return a>=0&&b>=0&&a<W&&b<H&&!seen.has(b*W+a)});if(!n.length){st.pop();continue}const d=n[R(n.length)],j=i+d[1]*W+d[0];c[i]&=~d[2];c[j]&=~d[3];seen.add(j);st.push(j)}
 let p=0,mv=0,won=0;
 s.innerHTML='<canvas width="540" height="720"></canvas><div class="pad"><i></i><button data-d="0">▲</button><i></i><button data-d="3">◀</button><button data-d="2">▼</button><button data-d="1">▶</button></div>';
 const x=$('canvas',s).getContext('2d');
 const draw=()=>{x.clearRect(0,0,540,720);x.strokeStyle='#ff7a1a';x.lineWidth=5;x.lineCap='round';x.beginPath();
  c.forEach((v,i)=>{const X=i%W*Z,Y=(i/W|0)*Z;if(v&1){x.moveTo(X,Y);x.lineTo(X+Z,Y)}if(v&2){x.moveTo(X+Z,Y);x.lineTo(X+Z,Y+Z)}if(v&4){x.moveTo(X,Y+Z);x.lineTo(X+Z,Y+Z)}if(v&8){x.moveTo(X,Y);x.lineTo(X,Y+Z)}});x.stroke();
  dr(x,'🍬',(W-1)*Z+30,(H-1)*Z+30,46);dr(x,'🎃',p%W*Z+30,(p/W|0)*Z+30,46)};
 const go=d=>{if(won||c[p]&(1<<d))return;p+=D[d][1]*W+D[d][0];mv++;SC.textContent=mv+' steps';beep(300+mv%8*25,.05);draw();if(p==W*H-1){won=1;end(mv,['You escaped!',`Found the candy in ${mv} steps 🍬`])}};
 $('.pad',s).onpointerdown=e=>{const d=e.target.dataset.d;if(d==null)return;go(+d);const t=setInterval(()=>go(+d),170);tm.push(t);const u=()=>clearInterval(t);addEventListener('pointerup',u,{once:true});addEventListener('pointercancel',u,{once:true})};
 draw();
}

/* 3. Monster Match */
function mem(s){
 const E=['🎃','👻','🦇','🕷️','🧛','💀','🧙','🍬'],cs=sh([...E,...E]);let op=[],ok=0,mv=0,lock=0;
 s.innerHTML='<div class="msg">Find all the matching pairs</div><div class="g g4">'+cs.map((e,i)=>`<button data-i="${i}">?</button>`).join('')+'</div>';
 const g=$('.g',s),B=g.children;
 g.onpointerdown=e=>{const i=+e.target.dataset.i;if(lock||isNaN(i)||op.includes(i)||B[i].disabled)return;B[i].textContent=cs[i];B[i].classList.add('on');op.push(i);beep(400,.08);
  if(op.length==2){mv++;SC.textContent=mv+' tries';const[a,b]=op;
   if(cs[a]==cs[b]){B[a].disabled=B[b].disabled=true;op=[];beep(700,.2);if(++ok==8)later(()=>end(mv,['You found them all!',`In ${mv} tries 🧛`]),500)}
   else{lock=1;later(()=>{[a,b].forEach(k=>{B[k].textContent='?';B[k].classList.remove('on')});op=[];lock=0},800)}}};
}

/* 4. Whack-a-Ghost */
function whack(s){
 let sc=0,t=30;
 s.innerHTML='<div class="msg">Tap the ghosts 👻. Don’t touch the skulls 💀</div><div class="g g3">'+'<button></button>'.repeat(9)+'</div>';
 const g=$('.g',s),B=[...g.children],up=()=>SC.textContent=`⏱ ${t}  ⭐ ${sc}`;up();
 g.onpointerdown=e=>{const b=e.target,k=b.dataset.k;if(!k)return;sc=Math.max(0,sc+(k=='g'?1:-2));beep(k=='g'?700:150,.1);b.textContent='💥';delete b.dataset.k;up();later(()=>{if(!b.dataset.k)b.textContent=''},250)};
 every(()=>{t--;up();if(t<=0)end(sc,['Time’s up!',`You scored ${sc} points`])},1000);
 every(()=>{const b=B[R(9)];if(b.dataset.k||b.textContent)return;const k=Math.random()<.75?'g':'s';b.dataset.k=k;b.textContent=k=='g'?'👻':'💀';later(()=>{if(b.dataset.k==k){delete b.dataset.k;b.textContent=''}},1000)},560);
}

/* 5. Treat Catcher */
function catchG(s){
 s.innerHTML='<div class="msg">Drag to move the basket. Dodge the spiders!</div><canvas width="540" height="720"></canvas>';
 const cv=$('canvas',s),x=cv.getContext('2d');let bx=270,L=3,sc=0,it=[],f=0;
 const mvTo=e=>{const r=cv.getBoundingClientRect();bx=Math.max(40,Math.min(500,(e.clientX-r.left)/r.width*540))};
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);mvTo(e)};cv.onpointermove=mvTo;
 const up=()=>SC.textContent='❤️'.repeat(Math.max(L,0))+'  ⭐ '+sc;up();
 every(()=>{f++;if(f%Math.max(16,42-sc)==0)it.push({x:30+R(480),y:-30,v:4+Math.random()*3+sc/14,e:Math.random()<.3?'🕷️':['🍬','🍭','🎃'][R(3)]});
  x.clearRect(0,0,540,720);
  it=it.filter(o=>{o.y+=o.v;if(o.y>650&&o.y<705&&Math.abs(o.x-bx)<58){if(o.e=='🕷️'){L--;beep(120,.3)}else{sc++;beep(800,.06)}up();return false}dr(x,o.e,o.x,o.y,52);return o.y<740});
  dr(x,'🧺',bx,680,84);
  if(L<=0)end(sc,['Game over!',`You caught ${sc} treats 🍬`])},25);
}

/* 6. Spooky Simon */
function simon(s){
 const C=['🎃','👻','🦇','🕷️'],F=[262,330,392,523],K=['#ff7a1a','#9b5cff','#2fbf4a','#e03a3a'];
 s.innerHTML='<div class="msg"></div><div class="g g2">'+C.map((c,i)=>`<button data-i="${i}" style="background:${K[i]}55;border-color:${K[i]}">${c}</button>`).join('')+'</div>';
 const g=$('.g',s),B=[...g.children],m=$('.msg',s);let seq=[],pos=0,turn=0;
 const flash=i=>{B[i].classList.add('fl');beep(F[i],.3);later(()=>B[i].classList.remove('fl'),320)};
 const round=()=>{turn=0;pos=0;seq.push(R(4));SC.textContent='Round '+seq.length;m.textContent='Watch closely…';seq.forEach((v,k)=>later(()=>flash(v),700+k*600));later(()=>{turn=1;m.textContent='Your turn!'},700+seq.length*600)};
 g.onpointerdown=e=>{const i=+e.target.dataset.i;if(!turn||isNaN(i))return;flash(i);if(i!=seq[pos]){turn=0;end(seq.length-1,['Oops!',`You reached round ${seq.length} 🦇`]);return}if(++pos==seq.length){turn=0;later(round,800)}};
 round();
}

/* 7. Word Witch (Halloween + cybersecurity words) */
function word(s){
 const W=[['PUMPKIN','Carved at Halloween'],['SKELETON','Rattling bones'],['VAMPIRE','Has fangs and a cape'],['FIREWALL','Blocks bad network traffic'],['PASSWORD','Keep it long and secret'],['MALWARE','Software that does harm'],['PHISHING','Fake emails that fish for info'],['WITCH','Rides a broomstick'],['ZOMBIE','Walks the night, wants brains'],['ENCRYPT','Scramble data so spies can’t read it']];
 const Q=sh([...W]).slice(0,5);let r=0,sc=0,w,tl,an;
 s.innerHTML='<div class="msg" id="h"></div><div class="row" id="a"></div><div class="row" id="l"></div><button class="btn" id="sk">Skip word</button>';
 const show=()=>{$('#a',s).innerHTML=w.split('').map((_,i)=>`<button class="sl" data-a="${i}">${an[i]!=null?tl[an[i]]:''}</button>`).join('');$('#l',s).innerHTML=tl.map((c,i)=>`<button data-t="${i}" ${an.includes(i)?'disabled':''}>${c}</button>`).join('')};
 const next=()=>{if(r>=5)return end(sc,['Spell-tacular!',`You unscrambled ${sc} of 5`]);w=Q[r][0];$('#h',s).textContent=`Word ${r+1} of 5. Hint: ${Q[r][1]}`;do tl=sh(w.split(''));while(tl.join('')==w);an=[];SC.textContent='⭐ '+sc;show()};
 s.onpointerdown=e=>{const b=e.target,d=b.dataset;if(b.id=='sk'){r++;return next()}
  if(d.t!=null&&an.length<w.length){an.push(+d.t);beep(500,.05)}else if(d.a!=null&&an[+d.a]!=null){an.splice(+d.a,1)}else return;show();
  if(an.length==w.length){if(an.map(i=>tl[i]).join('')==w){sc++;r++;beep(880,.3);$('#h',s).textContent='Correct!';later(next,800)}else $('#h',s).textContent='Not quite. Tap a letter slot to remove it.'}};
 next();
}

/* 8. Slide Puzzle */
function slide(s){
 const E=['🎃','👻','🦇','🕷️','🧛','💀','🧙','🍬',''];let a=[...E.keys()],e=8,mv=0;
 const adj=i=>[i-3,i+3,i%3?i-1:-1,i%3<2?i+1:-1].filter(j=>j>=0&&j<9);
 for(let k=0;k<120;k++){const n=adj(e),j=n[R(n.length)];[a[e],a[j]]=[a[j],a[e]];e=j}
 s.innerHTML='<div class="msg">Slide the tiles into this order:<br>🎃 👻 🦇 / 🕷️ 🧛 💀 / 🧙 🍬</div><div class="g g3"></div>';
 const g=$('.g',s),draw=()=>g.innerHTML=a.map((v,i)=>`<button data-i="${i}" ${v==8?'style="visibility:hidden"':''}>${E[v]}</button>`).join('');draw();
 g.onpointerdown=ev=>{const i=+ev.target.dataset.i;if(isNaN(i)||!adj(e).includes(i))return;[a[e],a[i]]=[a[i],a[e]];e=i;mv++;SC.textContent=mv+' moves';beep(350,.06);draw();if(a.every((v,k)=>v==k))end(mv,['Solved!',`Done in ${mv} moves 💀`])};
}

/* 9. Pumpkin Lights Out */
function lights(s){
 let a=Array(25).fill(0),mv=0;
 const tog=i=>{const x=i%5,y=i/5|0;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<5&&Y<5)a[Y*5+X]^=1})};
 for(let k=0;k<9;k++)tog(R(25));if(!a.some(v=>v))tog(12);
 s.innerHTML='<div class="msg">Turn off every jack-o’-lantern.<br>Each tap flips its neighbors too!</div><div class="g g5"></div>';
 const g=$('.g',s),draw=()=>g.innerHTML=a.map((v,i)=>`<button class="${v?'lt':''}" data-i="${i}">${v?'🎃':''}</button>`).join('');draw();
 g.onpointerdown=e=>{const i=+e.target.dataset.i;if(isNaN(i))return;tog(i);mv++;SC.textContent=mv+' taps';beep(300+a.filter(v=>v).length*30,.08);draw();if(!a.some(v=>v))end(mv,['Lights out!',`Cleared in ${mv} taps 🎃`])};
}

const G=[['Ghost Tic-Tac-Toe','👻',ttt],['Candy Maze','🍬',maze],['Monster Match','🧛',mem],['Whack-a-Ghost','🔨',whack],['Treat Catcher','🧺',catchG],['Spooky Simon','🦇',simon],['Word Witch','🧙',word],['Slide Puzzle','💀',slide],['Lights Out','🎃',lights]];
$('#home').innerHTML=G.map((g,i)=>`<button class="card" data-i="${i}"><b>${g[1]}</b>${g[0]}</button>`).join('');
$('#home').onclick=e=>{const c=e.target.closest('.card');if(c)play(+c.dataset.i)};
function play(i){stop();cur=i;S.onpointerdown=null;S.innerHTML='';SC.textContent='';$('#title').textContent=G[i][0];$('#hw').hidden=true;$('#game').hidden=false;G[i][2](S)}
function home(){stop();cur=-1;S.onpointerdown=null;S.innerHTML='';$('#game').hidden=true;$('#hw').hidden=false}
$('#back').onclick=home;
/* Leaderboards: saved in this browser's localStorage so they survive restarts */
const LK='haunted-arcade-v1',LB=(()=>{try{return JSON.parse(localStorage.getItem(LK))||{}}catch(e){return{}}})();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
I.trophy=`<path d='M18 6h28v18a14 14 0 0 1-28 0z' fill='#ffd23a'/><path d='M18 12H6c0 12 6 18 14 18M46 12h12c0 12-6 18-14 18' fill='none' stroke='#ffd23a' stroke-width='4'/><rect x='28' y='36' width='8' height='12' fill='#ffd23a'/><rect x='18' y='48' width='28' height='8' rx='2' fill='#ffd23a'/>`;
[[1,'maze','lo','steps'],[2,'mem','lo','tries'],[3,'whack','hi','points'],[4,'catch','hi','treats'],[5,'simon','hi','rounds'],[6,'word','hi','words'],[7,'slide','lo','moves'],[8,'lights','lo','taps']].forEach(([i,k,d,u])=>{G[i][3]=k;G[i][4]=d;G[i][5]=u});
$('#lbb').innerHTML=ic('trophy')+' Leaderboards';$('#lbb').onclick=()=>showLB(1);
const sv=()=>{try{localStorage.setItem(LK,JSON.stringify(LB))}catch(e){}};
const qual=(i,v)=>{const L=LB[G[i][3]]||[];return L.length<10||(G[i][4]=='hi'?v>L[9].s:v<L[9].s)};
const add=(i,n,v)=>{const k=G[i][3],e={n,s:v,t:Date.now()},L=LB[k]=LB[k]||[];L.push(e);L.sort((a,b)=>(G[i][4]=='hi'?b.s-a.s:a.s-b.s)||a.t-b.t);LB[k]=L.slice(0,10);sv();return e};
function board(i,me,n=5){const L=(LB[G[i][3]]||[]).slice(0,n);return `<div class='lb'>`+(L.length?L.map((e,k)=>`<div class='r${e===me?' me':''}'><span>${k+1}</span><span>${e.n}</span><span>${e.s} ${G[i][5]}</span></div>`).join(''):`<div class='h'>No scores yet. Be the first!</div>`)+`</div>`}
function ask(o,v,cb,i){let n='';const K='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
 const draw=()=>{o.innerHTML=`<b>High score!</b><div>${v} ${G[i][5]}. Enter your initials</div><div class='ini'>${[0,1,2].map(k=>`<span>${n[k]||''}</span>`).join('')}</div><div class='kb'>${K.map(k=>`<button data-k='${k}'>${k}</button>`).join('')}<button class='wd' data-k='-'>DEL</button><button class='sv' data-k='!'>SAVE</button></div><button class='btn' data-k='skip'>Skip</button>`};
 o.onpointerdown=e=>{const k=e.target.dataset.k;if(!k)return;
  if(k=='skip'){o.onpointerdown=null;return cb(null)}
  if(k=='!'){if(!n)return;o.onpointerdown=null;beep(880,.3);return cb(add(i,n,v))}
  if(k=='-')n=n.slice(0,-1);else if(n.length<3){n+=k;beep(500,.05)}
  draw()};
 draw()}
function end(a,b){const m=Array.isArray(a)?a:b,v=Array.isArray(a)?0:a,i=cur;endOld(m);const o=$('.ov',S);if(!G[i][3]||!(v>0))return;const html=o.innerHTML;
 const show=me=>{o.innerHTML=html;o.lastElementChild.insertAdjacentHTML('beforebegin',`<div class='h'>Top scores</div>`+board(i,me,5));$('#ag',o).onclick=()=>play(i);$('#hm',o).onclick=home};
 if(qual(i,v))ask(o,v,show,i);else show(null)}
function showLB(i){stop();cur=-2;let rc=0;$('#title').textContent='Leaderboards';SC.textContent='';$('#hw').hidden=true;$('#game').hidden=false;
 const ids=G.map((g,k)=>g[3]?k:-1).filter(k=>k>=0);
 const draw=()=>{S.innerHTML=`<div class='row'>${ids.map(k=>`<button data-i='${k}' class='${k==i?'on':''}'>${G[k][1]}</button>`).join('')}</div><div class='msg'>${G[i][0]}<br>${G[i][4]=='hi'?'Highest score wins':'Fewest '+G[i][5]+' wins'}</div>${board(i,null,10)}<button class='btn' id='rst' style='opacity:.35;font-size:18px;min-height:44px'>Staff: clear all scores (tap 5 times)</button>`};
 draw();S.onpointerdown=e=>{if(e.target.id=='rst'){if(++rc>=5){Object.keys(LB).forEach(k=>delete LB[k]);sv();rc=0}draw();return}const k=+e.target.dataset.i;if(isNaN(k))return;i=k;draw()}}

/* kiosk: return to menu after 90s without a touch; block context menu and zoom gestures */
addEventListener('pointerdown',()=>{clearTimeout(idle);idle=setTimeout(()=>{if(cur!=-1)home()},90000)});
addEventListener('contextmenu',e=>e.preventDefault());
['gesturestart','dblclick'].forEach(n=>addEventListener(n,e=>e.preventDefault()));
</script></body></html>
